[project]
name = "tensortrade"
version = "1.3.1"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "pytest>=7.4.0",
    "quantutils @ git+https://github.com/dshibanov/quantutils.git",
    # "pandas>=0.25.0",
    "pandas",
    "gym>=0.25.2",
    "pyyaml>=5.1.2",
    # "stochastic>=0.6.0",
    "tensorflow>=2.17",
    "ipython>=7.12.0",
    "matplotlib>=3.1.1",
    "plotly>=4.5.0",
    "ipywidgets>=7.0.0",
    "deprecated>=1.2.13",
    "ta>=0.10.2",
    "pandas-ta>=0.4",
    "gymnasium>=0.28.1",
    "tabulate>=0.9.0",
    "dm-tree>=0.1.8",
    "scikit-image>=0.21.0",
    "lz4>=4.3.2",
    "tensorflow-probability>=0.20.1",
    "icecream>=2.1.3",
    "static-frame>=2.0.1",
    # "numpy>=1.22,<1.24",
    "numpy",
    "ray[tune]>=2.44.1,<3.0.0",
    "ccxt>=4.4.78,<5.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "ta-lib>=0.6.3,<0.7.0",
    "quantstats>=0.0.64,<0.0.65",
    "finplot @ git+https://github.com/dshibanov/finplot.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required if you use git/file/path dependencies → prevents build failures
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = false
prerelease = "allow"

[dependency-groups]
# dev = ["numpy>=1.22,<1.24"]
dev = []


